# Root container, vertical layout
# Local style: apply to rows to change height easily (change 285 below)
- type: style
  id: '@tablet_row'
  pad_all: 6
  # size: [100%, 285]
  width: 100%
  flex_grow: 3

- type: obj
  add_style: [@container, 0]
  add_style: [@flex_y, 0]
  size: [100%, 100%]
  #lv_obj_remove_flag: LV_OBJ_FLAG_SCROLLABLE
  children:
    # Titlebar row: page selector, WCS, state, GPIO toggle
    - type: use-view
      id: @titlebar
      size: [100%, 44]

    # Row 1: Axis-Pos Display (left) | Job Status (right)
    - type: obj
      add_style: ['@container', 0]
      add_style: ['@flex_x', 0]
      add_style: ['@tablet_row', 0]
      # Change the numeric height here to adjust all rows (except keyboard)
      children:
        - add_style: ['@container_transp', 0]
          flex_grow: 1
          height: 100%
          children:
            - type: use-view
              id: '@jog_view'

        - type: obj
          size: [40%, 100%]
          add_style: ['@container', 0]
          children:
            - type: use-view
              id: '@job_status_view'

    # Row 2: Movement Queue Preview (placeholder for future widget)
    - type: obj
      add_style: ['@container', 0]
      add_style: ['@tablet_row', 0]
      height: 8
      pad_all: 8
      children:
        - type: label
          text: "Movement Queue Preview (placeholder: iso, top, sides, multi)"
          text_font: '@font_kode_20'
          center: []

    # Row 3: Probing Wizard / Mos Probe (left)  | Cam Positioning (right)
    - type: obj
      id: '@probe_row'
      add_style: ['@container', 0]
      add_style: ['@flex_x', 0]
      add_style: ['@tablet_row', 0]
      size: [100%, 285]
      # Hide probe-row while on-screen keyboard is active
      # observes:
      # ui.mdi_input_active:
      #    visible: { true: false, false: true }
      children:
        - flex_grow: 1
          add_style: ['@container', 0]
          children:
            - type: use-view
              id: '@probing_wizard'

        - size: [55%, 100%]
          add_style: ['@container', 0]
          children:
            - type: use-view
              id: '@cam_positioning_view'

    # Row 4: Tabview with MDI / G-Code Buffer / Files+Macros / IO-Panel
    # '/' separated in the user's note → implemented as a tabview with deferred children
    - type: obj
      add_style: ['@container', 0]
      add_style: ['@tablet_row', 0]
      # size: [100%, 350]
      flex_grow: 5
      children:
        - type: tabview
          tab_bar_position: LV_DIR_TOP
          tab_bar_size: 36
          width: 100%
          height: 100%
          add_style: ['@container', 0]
          children:
            # Style the left tab bar itself
            - init: { lv_tabview_get_tab_bar: [] }
              add_style: ['@container', 0]
              add_style: ['@bg_gradient', 0]
              pad_all: 0

            # Style the tab content area
            - init: { lv_tabview_get_content: [] }
              remove_flag: LV_OBJ_FLAG_SCROLLABLE

            - init: { lv_tabview_add_tab: ["MDI"] }
              deferred: true
              add_style: ['@container', 0]
              children:
                - type: use-view
                  id: '@mdi_view'

            - init: { lv_tabview_add_tab: ["G-Code"] }
              deferred: true
              add_style: ['@container', 0]
              children:
                - type: label
                  text: "G-Code Buffer (placeholder)"
                  center: []

            - init: { lv_tabview_add_tab: ["Files+Macros"] }
              deferred: true
              add_style: ['@container', 0]
              children:
                - type: use-view
                  id: '@filelist_view'

            - init: { lv_tabview_add_tab: ["IO Panel"] }
              deferred: true
              add_style: ['@container', 0]
              children:
                - type: use-view
                  id: '@io_panel_view'

# Disconnected overlay (same behaviour as other layouts)
- type: obj
  id: '@disconnected_overlay'
  size: [100%, 100%]
  bg_color: '#000000'
  bg_opa: LV_OPA_70
  add_flag: LV_OBJ_FLAG_CLICKABLE
  add_flag: LV_OBJ_FLAG_HIDDEN
  observes:
    machine.connection_status:
      visible: { true: false, false: true, default: true }
  children:
    - type: label
      text: "Connecting..."
      text_font: '@font_kode_34'
      center: []