- type: component
  id: @label_text_actionable
  info: |
    Text-label indicating that clicking can perform an action
    ---
    Shows a label and an actionable text on the right. Context variables:
    - $label: descriptive label text
    - $text: actionable text shown on right
    - $observable: observable variable to watch
    - $fmt: format string for observable
    - $action: action to perform when tapped
  content:
    add_style: [@container_transp, 0]
    add_style: [@flex_x, 0]
    add_style: [@bg_group, 0]
    size: [100%, LV_SIZE_CONTENT]
    pad_all: 3
    pad_bottom: 8
    pad_top: 8
    children:
      - type: label
        flex_grow: 5
        text: $label/Label text
      - type: label
        add_style: [@text_actionable, 0]
        size: [LV_SIZE_CONTENT, 20]
        text: $text
        set_ext_click_area: 10
        observes: { $observable: { text: "$fmt/format string for observable" } }
        action: { $action: { numeric_input_dialog: { format: "%d mm", min: "$min/min numeric input", max: "$max/max numeric input", initial: "$initial/initial numeric input", text: "$label/input label"} } }
