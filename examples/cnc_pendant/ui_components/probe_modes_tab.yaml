- type: component
  id: @probe_modes_tab
  info: |
    Probe modes tab group.
    ---
    Tab that contains a grid of `probe_btn` instances laid out in tabs. No extra context required.
  content:
    init: { lv_tabview_add_tab: ['Modes'] }
    add_style: [@container_transp, 0]
    size: [LV_SIZE_CONTENT, LV_SIZE_CONTENT]
    remove_flag: LV_OBJ_FLAG_SCROLLABLE
    children:
      - add_style: [@container_transp, 0]
        add_style: [@bg_gradient, 0]
        size: [LV_SIZE_CONTENT, LV_SIZE_CONTENT]
        children:
          - type: obj
            layout: LV_LAYOUT_GRID
            size: [LV_SIZE_CONTENT, LV_SIZE_CONTENT]
            add_style: [@container_transp, 0]
            add_style: [@bg_group, 0]
            pad_all: 10
            grid_dsc_array: [[80, 80, 80, LV_GRID_TEMPLATE_LAST], [80, 80, 80, LV_GRID_TEMPLATE_LAST]]
            children:
              - type: use-view
                id: @probe_btn
                context: { row: 0, col: 0, path: '?|@$&img_probe_icon_0|S:~/Development/SW/CNC/lvgl_ui/examples/img/probe_grid_0.png' }
              - type: use-view
                id: @probe_btn
                context: { row: 0, col: 1, path: '?|@$&img_probe_icon_1|S:~/Development/SW/CNC/lvgl_ui/examples/img/probe_grid_1.png' }
              - type: use-view
                id: @probe_btn
                context: { row: 0, col: 2, path: '?|@$&img_probe_icon_2|S:~/Development/SW/CNC/lvgl_ui/examples/img/probe_grid_2.png' }
              - type: use-view
                id: @probe_btn
                context: { row: 1, col: 0, path: '?|@$&img_probe_icon_3|S:~/Development/SW/CNC/lvgl_ui/examples/img/probe_grid_3.png' }
              - type: use-view
                id: @probe_btn
                context: { row: 1, col: 1, path: '?|@$&img_probe_icon_4|S:~/Development/SW/CNC/lvgl_ui/examples/img/probe_grid_4.png' }
              - type: use-view
                id: @probe_btn
                context: { row: 1, col: 2, path: '?|@$&img_probe_icon_5|S:~/Development/SW/CNC/lvgl_ui/examples/img/probe_grid_5.png' }
              - type: use-view
                id: @probe_btn
                context: { row: 2, col: 0, path: '?|@$&img_probe_icon_6|S:~/Development/SW/CNC/lvgl_ui/examples/img/probe_grid_6.png' }
