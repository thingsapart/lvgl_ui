- type: component
  id: '@chipload_scale'
  info: |
    Chipload display combining a labeled scale and tool info.
    ---
    Left column is `labeled_scale` and right column shows tool properties and min/max chipload. Context variables: $rate_value, $range_min, $range_max.
  content:
    size: [100%, 100%]
    add_style: ['@container_transp', 0]
    add_style: ['@bg_group', 0]
    layout: LV_LAYOUT_FLEX
    flex_flow: LV_FLEX_FLOW_ROW
    height: LV_SIZE_CONTENT
    pad_column: 0
    pad_bottom: $pad
    pad_top: $pad
    children:
      # Left Column: scale
      - type: use-view
        id: @labeled_scale

      # Right Column: units, override
      - layout: LV_LAYOUT_FLEX
        add_style: ['@container_transp', 0]
        flex_flow: LV_FLEX_FLOW_COLUMN
        width: LV_SIZE_CONTENT
        min_width: 50
        height: LV_SIZE_CONTENT
        pad_right: 0
        pad_row: 0
        flex_align: [LV_FLEX_ALIGN_CENTER, LV_FLEX_ALIGN_SPACE_AROUND, LV_FLEX_ALIGN_CENTER]
        add_flag: LV_OBJ_FLAG_CLICKABLE
        children:
          - type: label
            text_font: '@font_kode_14'
            add_style: [@indicator_yellow, 0]
            observes: { tool_material: { text: "%s" } }
          - type: label
            add_style: [@indicator_yellow, 0]
            observes: { tool_dia: { text: "%g mm" } }
          - type: label
            text_font: '@font_kode_14'
            add_style: [@indicator_yellow, 0]
            observes: { tool_n_flutes: { text: "%g-FL" } }
          - add_style: [@flex_y, 0]
            add_style: [@container_transp, 0]
            size: [LV_SIZE_CONTENT, LV_SIZE_CONTENT]
            pad_row: 0
            children:
              - type: label
                text_font: '@font_kode_14'
                observes: { chipload_min: { text: "%0.2f" } }
              - type: label
                text_font: '@font_kode_14'
                observes: { chipload_max: { text: "%0.2f" } }
