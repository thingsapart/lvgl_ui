- type: component
  id: '@chipload_scale'
  info: |
    Chipload display combining a labeled scale and tool info.
    ---
    Left column is `labeled_scale` and right column shows tool properties and current chipload.
    Context variables: $rate_value (→ machine.chipload_relative), $range_min, $range_max.
    Observes: machine.chipload, tool.diameter_mm, tool.flute_count, tool_material.
  content:
    size: [100%, 100%]
    add_style: ['@container_transp', 0]
    add_style: ['@bg_group', 0]
    layout: LV_LAYOUT_FLEX
    flex_flow: LV_FLEX_FLOW_ROW
    height: LV_SIZE_CONTENT
    pad_column: 0
    pad_bottom: $pad
    pad_top: $pad
    children:
      # Left Column: scale
      - type: use-view
        id: @labeled_scale

      # Right Column: tool info + current chipload value
      - layout: LV_LAYOUT_FLEX
        add_style: ['@container_transp', 0]
        flex_flow: LV_FLEX_FLOW_COLUMN
        width: LV_SIZE_CONTENT
        min_width: 50
        height: LV_SIZE_CONTENT
        pad_right: 0
        pad_row: 0
        flex_align: [LV_FLEX_ALIGN_CENTER, LV_FLEX_ALIGN_SPACE_AROUND, LV_FLEX_ALIGN_CENTER]
        add_flag: LV_OBJ_FLAG_CLICKABLE
        children:
          - type: label
            text_font: '@font_kode_14'
            add_style: [@indicator_yellow, 0]
            observes: { tool_material: { text: "%s" } }
          - type: label
            text_font: '@font_kode_14'
            add_style: [@indicator_yellow, 0]
            observes: { tool.diameter_mm: { text: "%g mm" } }
          - type: label
            text_font: '@font_kode_14'
            add_style: [@indicator_yellow, 0]
            observes: { tool.flute_count: { text: "%g FL" } }
          - type: label
            text_font: '@font_kode_14'
            add_style: [@indicator_yellow, 0]
            observes: { machine.chipload: { text: "%0.3f" } }
