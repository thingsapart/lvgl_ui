# XYZ position display
- type: component
  id: '@xyz_axis_pos_display'
  content:
    size: [100%, 100%]
    add_style: [@container, 0]
    add_style: [@flex_y, 0]
    add_style: [@bg_gradient, 0]
    bg_opa: 255
    pad_column: 0
    pad_row: 0
    remove_flag: LV_OBJ_FLAG_SCROLLABLE
    children:
      - type: use-view
        id: @axis_pos_display
        context:
          axis: X
          abs_pos: "000.00"
          wcs_pos: "000.00 G54"
          delta_pos: "000.00   "
          homed_state: motion.homed.x
          selected_state: motion.jog.axis_is_x
          home_action: action.motion.jog.axis_select_x
          wcs_state: motion.position.work_x
          pos_state: motion.position.machine_x
          delta_pos_state: delta_pos_x

      - type: use-view
        id: @axis_pos_display
        context:
          axis: Y
          abs_pos: "000.00"
          wcs_pos: "000.00"
          delta_pos: "000.00   "
          homed_state: motion.homed.y
          selected_state: motion.jog.axis_is_y
          home_action: action.motion.jog.axis_select_y
          wcs_state: motion.position.work_y
          pos_state: motion.position.machine_y
          delta_pos_state: delta_pos_y

      - type: use-view
        id: @axis_pos_display
        context:
          axis: Z
          abs_pos: "000.00"
          wcs_pos: "000.00"
          delta_pos: "000.00   "
          homed_state: motion.homed.z
          selected_state: motion.jog.axis_is_z
          home_action: action.motion.jog.axis_select_x
          wcs_state: motion.position.work_z
          pos_state: motion.position.machine_z
          delta_pos_state: delta_pos_z


      - layout: LV_LAYOUT_FLEX
        flex_align: [LV_FLEX_ALIGN_START, LV_FLEX_ALIGN_CENTER, LV_FLEX_ALIGN_START]
        add_style: [@container_transp, 0]
        size: [LV_SIZE_CONTENT, LV_SIZE_CONTENT]
        pad_right: 5
        children:
          - type: button
            observes: {machine.program_is_running: visible }
            children:
              - type: label
                text: LV_SYMBOL_PLAY
                width: LV_SIZE_CONTENT
                action: { action.program.run: trigger }
          - type: button
            observes: { machine.program_is_running: { visible: { true: true, false: false } } }
            children:
              - type: label
                text: LV_SYMBOL_STOP
                width: LV_SIZE_CONTENT
                action: { action.program.stop: trigger }
          - type: label
            observes: { machine.status_text: { text: "MODE: %s" } }
          - type: label
            add_style: [@indicator_yellow, 0]
            observes: { motion.wcs.active_name: { text: "- %s" } }
            action: { action.motion.wcs.cycle: trigger }

- type: component
  id: @labeled_scale
  content:
    layout: LV_LAYOUT_FLEX
    add_style: ['@container_transp', 0]
    flex_flow: LV_FLEX_FLOW_COLUMN
    width: 100%
    height: LV_SIZE_CONTENT
    flex_grow: 1
    children:
      - type: obj # grid
        layout: LV_LAYOUT_GRID
        grid_dsc_array: [[LV_GRID_CONTENT, LV_GRID_FR1, LV_GRID_TEMPLATE_LAST], [LV_GRID_CONTENT, LV_GRID_TEMPLATE_LAST]]
        add_style: ['@container_transp', 0]
        width: 100%
        height: LV_SIZE_CONTENT
        children:
          - layout: LV_LAYOUT_FLEX
            size: [100, LV_SIZE_CONTENT]
            add_style: [@container_transp, 0]
            grid_cell: [LV_GRID_ALIGN_STRETCH, 0, 1, LV_GRID_ALIGN_CENTER, 0, 1]
            remove_flag: LV_OBJ_FLAG_SCROLLABLE
            pad_column: 0
            pad_bottom: -8
            children:
              - type: label
                text: $letter
                text_font: '@font_kode_40'
                height: LV_SIZE_CONTENT
                pad_left: 5
              - type: label
                text: $label
                pad_left: 0
                height: LV_SIZE_CONTENT
                text_font: '@font_kode_14'
                add_style: ['@border_top_btn', 0]
          - type: label
            grid_cell: [LV_GRID_ALIGN_END, 1, 1, LV_GRID_ALIGN_END, 0, 1]
            text_font: '@font_kode_30'
            height: LV_SIZE_CONTENT
            text: '1000'
            pad_right: 5
            observes: { $rate_value: { text: "%.0f" } }
      - layout: LV_LAYOUT_FLEX
        flex_flow: LV_FLEX_FLOW_COLUMN
        add_style: ['@container_transp', 0]
        width: 100%
        height: LV_SIZE_CONTENT
        children:
          - type: bar
            width: 100%
            height: 15
            margin_left: 15
            margin_right: 15
            add_style: ['@bar_indicator', LV_PART_MAIN]
            add_style: ['@bar_indicator', LV_PART_INDICATOR]
            value: [65, 0]
            range: [$range_min, $range_max]
            bg_color: '#5dd555'
            bg_opa: 255
            #observes: { $rate_value: { value: [LV_ANIM_OFF] } }
            observes: { $rate_value: 'value'}
          - type: scale
            width: 100%
            height: 18
            margin_left: 15
            margin_right: 15
            margin_bottom: 2
            add_style: [@tick_color, LV_PART_ITEMS]
            add_style: [@tick_color, LV_PART_MAIN]
            add_style: [@tick_color, LV_PART_INDICATOR]
            # text_font: '@font_montserrat_12'

- type: component
  id: '@feed_rate_scale'
  content:
    size: [100%, 100%]
    add_style: ['@container_transp', 0]
    add_style: ['@bg_group', 0]
    layout: LV_LAYOUT_FLEX
    flex_flow: LV_FLEX_FLOW_ROW
    height: LV_SIZE_CONTENT
    pad_column: 0
    pad_bottom: $pad
    pad_top: $pad
    children:
      - type: use-view
        id: @labeled_scale
        # context: is all inherited.

      # Right column
      - layout: LV_LAYOUT_FLEX
        add_style: ['@container_transp', 0]
        flex_flow: LV_FLEX_FLOW_COLUMN
        size: [LV_SIZE_CONTENT, LV_SIZE_CONTENT]
        min_width: 50
        pad_right: 0
        flex_align: [LV_FLEX_ALIGN_CENTER, LV_FLEX_ALIGN_SPACE_AROUND, LV_FLEX_ALIGN_CENTER]
        add_flag: LV_OBJ_FLAG_CLICKABLE
        pad_top: 18
        action: { $override_state: { numeric_input_dialog: { min: 0, max: 200, initial: 100, format: "%d %% ", text: 'Override:' } } }
        children:
          - type: label
            text: $unit
            text_font: '@font_kode_14'
            add_style: ['@border_top_btn', 0]
          - type: label
            text: $ovr
          - type: label
            text: 65%%
            text_font: '@font_kode_14'
            add_style: [@indicator_yellow, 0]
            observes: { $override_value: { text: "%g%%" } }

