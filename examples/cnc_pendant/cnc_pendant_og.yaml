- type: component
  id: '@jog_feed'
  content:
    size: [100%, 100%]
    add_style: ['@container_transp', 0]
    add_style: ['@bg_group', 0]
    layout: LV_LAYOUT_FLEX
    flex_flow: LV_FLEX_FLOW_ROW
    height: LV_SIZE_CONTENT
    pad_column: 0
    pad_bottom: $pad
    pad_top: $pad
    children:
      # Left Column
      - layout: LV_LAYOUT_FLEX
        add_style: ['@container_transp', 0]
        flex_flow: LV_FLEX_FLOW_COLUMN
        width: 100%
        height: LV_SIZE_CONTENT
        flex_grow: 1
        children:
          - type: label
            text: $label
            height: LV_SIZE_CONTENT
            width: 100%
            text_font: '@font_kode_20'
            add_style: ['@border_top_btn', 0]
          - type: obj # grid
            layout: LV_LAYOUT_GRID
            grid_dsc_array: [[22, 50, 12 , 50, LV_GRID_TEMPLATE_LAST], [LV_GRID_CONTENT, LV_GRID_TEMPLATE_LAST]]
            add_style: ['@container_transp', 0]
            width: 100%
            height: LV_SIZE_CONTENT
            pad_left: 2
            children:
              - type: label
                text: 'XY'
                text_font: '@font_kode_20'
                grid_cell: [LV_GRID_ALIGN_START, 0, 1, LV_GRID_ALIGN_START, 0, 1]
                height: LV_SIZE_CONTENT
                add_flag: LV_OBJ_FLAG_CLICKABLE
                action: { action.jog.cycle_step_xy: trigger }
              - type: label
                grid_cell: [LV_GRID_ALIGN_START, 1, 1, LV_GRID_ALIGN_END, 0, 1]
                text_font: '@font_kode_20'
                height: LV_SIZE_CONTENT
                text: '10'
                pad_right: 10
                #add_style: ['@border_right', 0]
                add_style: ['@indicator_yellow', 0]
                add_flag: LV_OBJ_FLAG_CLICKABLE
                action: { action.jog.cycle_step_xy: trigger }
                observes: { motion.jog.step_xy: { text: '%g' } }
              - type: label
                text: Z
                text_font: '@font_kode_20'
                grid_cell: [LV_GRID_ALIGN_START, 2, 1, LV_GRID_ALIGN_START, 0, 1]
                height: LV_SIZE_CONTENT
                add_flag: LV_OBJ_FLAG_CLICKABLE
                action: { action.jog.cycle_step_z: trigger }
              - type: label
                grid_cell: [LV_GRID_ALIGN_START, 3, 1, LV_GRID_ALIGN_END, 0, 1]
                text_font: '@font_kode_20'
                height: LV_SIZE_CONTENT
                text: ' 5'
                add_style: ['@indicator_yellow', 0]
                add_flag: LV_OBJ_FLAG_CLICKABLE
                action: { action.jog.cycle_step_z: trigger }
                observes: { motion.jog.step_z: { text: '%g' } }

      # Right column
      - layout: LV_LAYOUT_FLEX
        add_style: ['@container_transp', 0]
        flex_flow: LV_FLEX_FLOW_COLUMN
        width: LV_SIZE_CONTENT
        min_width: 50
        height: LV_SIZE_CONTENT
        pad_right: 0
        children:
          - type: label
            text: $unit
            text_font: '@font_kode_14'
            add_style: ['@border_top_btn', 0]
          - type: label
            text: $ovr
          - type: label
            text_font: '@font_kode_14'
            add_style: [@indicator_yellow, 0]
            text: '100% '


- type: component
  id: '@jog_view'
  content:
    layout: LV_LAYOUT_FLEX
    flex_flow: LV_FLEX_FLOW_ROW
    flex_align: [LV_FLEX_ALIGN_CENTER, LV_FLEX_ALIGN_CENTER, LV_FLEX_ALIGN_CENTER]
    add_style: ['@container', 0]
    size: [100%, 100%]
    remove_flag: LV_OBJ_FLAG_SCROLLABLE
    border_width: 0
    pad_all: 0
    margin_all: 0
    outline_width: 0
    name: main
    children:
      - layout: LV_LAYOUT_FLEX
        flex_flow: LV_FLEX_FLOW_COLUMN
        add_style: ['@container', 0]
        height: 100%
        flex_grow: 4
        border_side: LV_BORDER_SIDE_RIGHT
        border_width: 1
        radius: 0
        border_color: '#333333'
        border_opa: 255
        #bg_opa: 0
        children:
          - type: use-view
            id: '@xyz_axis_pos_display'

      # Right main column (Feeds & Speeds)
      - layout: LV_LAYOUT_FLEX
        flex_flow: LV_FLEX_FLOW_COLUMN
        add_style: ['@container', 0]
        add_style: [@bg_gradient, 0]
        height: 100%
        flex_grow: 4
        pad_top: 2
        pad_right: 2
        margin_left: 2
        margin_right: 2
        children:
          - type: use-view
            id: '@feed_rate_scale'
            context:
              unit: MM/MIN
              label: FEED
              letter: F
              ovr: F Ovr
              pad: 4
              rate_value: motion.feedrate_current
              range_min: 0
              range_max: 5000
              override_value: overrides.feed_pct
              override_state: set_feed_override
          - type: use-view
            id: '@feed_rate_scale'
            context:
              unit: /MIN
              label: SPEED
              letter: S
              ovr: S Ovr
              pad: 4
              range_min: 0
              range_max: 24000
              rate_value: spindle.speed_rpm
              override_value: speed_override_pct
              override_state: set_speed_override
          - type: use-view
            id: '@jog_feed'
            observes: { machine.program_is_running: { visible: { true: false, false: true } } }
            context:
              unit: MM
              label: JOG
              ovr: Jog Ovr
              pad: 18
          - type: use-view
            id: '@chipload_scale'
            observes: { machine.program_is_running: { visible: { true: true, false: false } } }
            context:
              unit: /MIN
              label: Chipload
              letter: C
              pad: 4
              range_min: -50
              range_max: 150
              rate_value: chipload_disp

