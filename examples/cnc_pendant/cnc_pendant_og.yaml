- type: component
  id: @label_text_actionable
  info: "Text-label indicating that clicking can perform an action"
  content:
    add_style: [@container_transp, 0]
    add_style: [@flex_x, 0]
    add_style: [@bg_group, 0]
    size: [100%, LV_SIZE_CONTENT]
    pad_all: 3
    children:
      - type: label
        flex_grow: 5
        text: $label/Label text
      - type: label
        add_style: [@text_actionable, 0]
        flex_grow: 2
        text: $text
        observes: { $observable: { text: "$fmt/format string for observable" } }
        action: { $action: { numeric_input_dialog: { format: "%d mm", min: "$min/min numeric input", max: "$max/max numeric input", initial: "$initial/initial numeric input", text: "$label/input label"} } }

- type: component
  id: @probe_view
  content:
    add_style: [@container_transp, 0]
    add_style: [@flex_x, 0]
    size: [100%, 100%]
    children:
      - type: tabview
        tab_bar_position: LV_DIR_BOTTOM
        tab_bar_size: 40
        size: [245, 100%]
        # size: [500, 100%]
        add_style: [@container_transp, 0]
        add_style: [@bg_gradient, 0]
        children:
          - init: { lv_tabview_get_tab_bar: [] }
            add_style: [@container_transp, 0]
            add_style: [@bg_gradient, 0]
          - init: { lv_tabview_get_content: [] }
            remove_flag: LV_OBJ_FLAG_SCROLLABLE
          - init: { lv_tabview_add_tab: ['Inside'] }
            add_style: [@container_transp, 0]
            size: [LV_SIZE_CONTENT, LV_SIZE_CONTENT]
            remove_flag: LV_OBJ_FLAG_SCROLLABLE
            children:
                  - add_style: [@container_transp, 0]
                    add_style: [@bg_gradient, 0]
                    size: [LV_SIZE_CONTENT, LV_SIZE_CONTENT]
                    children:
                      - type: obj
                        layout: LV_LAYOUT_GRID
                        size: [LV_SIZE_CONTENT, LV_SIZE_CONTENT]
                        add_style: [@container_transp, 0]
                        add_style: [@bg_group, 0]
                        pad_all: 5
                        pad_row: 5
                        pad_column: 5
                        grid_dsc_array: [[75, 75, 75, LV_GRID_TEMPLATE_LAST], [75, 75, 75, LV_GRID_TEMPLATE_LAST]]
                        # grid_dsc_array: [[160, 160, 160, LV_GRID_TEMPLATE_LAST], [160, 160, 160, LV_GRID_TEMPLATE_LAST]]
                        children:
                          - type: use-view
