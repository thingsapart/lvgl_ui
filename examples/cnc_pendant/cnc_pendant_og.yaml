            id: @label_text_actionable
            context:
              label: 'Width / Radius:'
              text: '100 mm'
              observable: probe_w
              fmt: '%g mm'
              action: set_probe_width
              min: 1
              max: 200
              initial: 100
          - type: use-view
            id: @label_text_actionable
            context:
              label: 'Height:'
              text: '100 mm'
              observable: probe_h
              fmt: '%g mm'
              action: set_probe_height
              min: 1
              max: 200
              initial: 100
          - type: use-view
            id: @label_text_actionable
            context:
              label: 'Clearance:'
              text: '5 mm'
              observable: probe_cl
              fmt: '%g mm'
              action: set_probe_cl
              min: 1.0
              max: 20.0
              initial: 5.0
          - type: use-view
            id: @label_text_actionable
            context:
              label: 'Overtravel:'
              text: '2 mm'
              observable: probe_ov
              fmt: '%g mm'
              action: set_probe_ov
              min: 0.1
              max: 10.0
              initial: 2.0
          - type: obj
            add_style: [@container_transp, 0]
            add_style: [@flex_x, 0]
            add_style: [@bg_group, 0]
            size: [100%, LV_SIZE_CONTENT]
            flex_align: [LV_FLEX_ALIGN_START, LV_FLEX_ALIGN_CENTER, LV_FLEX_ALIGN_CENTER]
            pad_all: 3
            children:
              - type: label
                text: Quick Mode:
                flex_grow: 5
              - type: switch
                height: 20
                width: 40
                margin_right: 10
                action: { set_probe_quick: toggle }
                observes: { probe_quick: { checked: value.bool } }

####################
## Main UI Layut ##
####################

- type: tileview
  add_style: ['@container', 0]
  size: [100%, 100%]
  pad_row: 0
  pad_column: 0
  scrollbar_mode: LV_SCROLLBAR_MODE_ACTIVE
  children:
    - init: { lv_tileview_add_tile: [0, 0, LV_DIR_RIGHT] }
      add_style: ['@container', 0]
      children:
        - type: use-view
          id: '@jog_view'
    - init: { lv_tileview_add_tile: [1, 0, LV_DIR_LEFT | LV_DIR_RIGHT] }
      add_style: ['@container', 0]
        children:
          - type: use-view
            id: '@probe_view'
    - init: { lv_tileview_add_tile: [2, 0, LV_DIR_LEFT] }
      add_style: ['@container', 0]
        children:
          - type: probing_wizard
            id: '@probing_wizard'
            lv_probing_wizard_set_mode: [LV_PROBING_WIZARD_MODE_RECTANGLE, false]


# This overlay will appear when the machine is disconnected.
# It covers the whole screen and prevents interaction with other controls.
- type: obj
  id: '@disconnected_overlay'
  size: [100%, 100%]
  bg_color: '#000000'
  bg_opa: LV_OPA_70
  add_flag: LV_OBJ_FLAG_CLICKABLE
  add_flag: LV_OBJ_FLAG_HIDDEN
  observes:
    machine.connection_status:
      visible: { true: false, false: true, default: true } # Show when not connected
  children:
    - type: label
      text: "Connecting..."
      text_font: '@font_kode_34'
      center: []

- type: button
  id: '@jog_axis_selector'
  size: [55, 55]
  radius: LV_RADIUS_CIRCLE
  # lv_obj_align: [LV_ALIGN_BOTTOM_RIGHT, -15, -15]
  lv_obj_align: [LV_ALIGN_TOP_LEFT, 15, 15]
  shadow_width: 10
  shadow_opa: 150
  shadow_offset_y: 4
  action: { action.motion.jog.axis_cycle: trigger }
  observes: { ui.active_tile_index: { visible: { 0: false, 1: true, 2: true } } }
  children:
    - type: label
      text_font: '@font_kode_24'
      center: []
      observes:
        motion.jog.axis_selected_str:
          text: "%s"